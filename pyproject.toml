[project]
name = "sysrev-agents"
version = "0.1.0"
description = "PRISMAgent: agentic AI pipeline (LangGraph + RAG) for rigorous, transparent and reproducible PRISMA 2020 systematic reviews"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain-core",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-groq",
    "langchain-ollama",
    "langchain-chroma",
    "langchain-text-splitters",
    "chromadb",
    "fastembed",
    "flashrank",
    "rank-bm25",
    "httpx",
    "rapidfuzz",
    "pymupdf",
    "python-docx",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "typer",
    "rich",
    "matplotlib",
    "fastapi",
    "uvicorn",
]

[project.urls]
Repository = "https://github.com/manal-0603/PRISMAgent"
Documentation = "https://github.com/manal-0603/PRISMAgent/blob/main/docs/TECHNICAL_REPORT.md"

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
sysrev = "sysrev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysrev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # typer declares options as function-call defaults
    "B905",  # zip() without strict=: the paired lists are built together
]

[tool.ruff.lint.per-file-ignores]
# sentences of the manuscript and of the benchmark report are kept on one line each
"src/sysrev/agents/synthesis.py" = ["E501"]
"src/sysrev/evaluation/benchmark.py" = ["E501"]
