[project]
name = "sysrev-agents"
version = "0.1.0"
description = "PRISMAgent: agentic AI pipeline (LangGraph + RAG) for rigorous, transparent and reproducible PRISMA 2020 systematic reviews"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain-core",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-groq",
    "langchain-ollama",
    "langchain-chroma",
    "langchain-text-splitters",
    "chromadb",
    "fastembed",
    "flashrank",
    "rank-bm25",
    "httpx",
    "rapidfuzz",
    "pymupdf",
    "python-docx",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "typer",
    "rich",
    "matplotlib",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sysrev = "sysrev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysrev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
